name: ✨ Feature request
description: Suggest an idea or an improvement
title: "✨ "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 🤔 What problem would it solve?
      description: Describe the situation in which the current behaviour gets in the way.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 💡 Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 🔀 Alternatives you considered
