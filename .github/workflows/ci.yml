name: 🚀 Finance | CI

# Every push and pull request on the long-lived branches, or by hand
on:
  push:
    branches: ["main", "staging", "development"]
  pull_request:
    branches: ["main", "staging", "development"]
  workflow_dispatch:

# A read-only token unless a job asks for more
permissions:
  contents: read

# One run per branch; a new push to a pull request cancels the older one
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No usage reports from Next.js
env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: 🔍 Verify | Lint, format, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Git | Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🟢 Node | Set up environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 📦 NPM | Install dependencies
        run: npm ci

      - name: 🔏 NPM | Verify registry signatures
        run: npm audit signatures

      - name: 🏷️ Release | Check the version and its changelog entry
        run: node scripts/release-notes.mjs > /dev/null

      - name: 🧹 Oxlint | Lint code
        run: npm run lint -- --format github

      - name: 🧾 Text | No em or en dashes
        run: npm run lint:text

      - name: 🎨 Oxfmt | Check formatting
        run: npm run format:check

      - name: 🧠 TypeScript | Check types
        run: npm run typecheck

      - name: 🧪 Vitest | Run tests with coverage
        run: npm run test:coverage

      - name: 📊 Coverage | Publish summary
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: 📤 Coverage | Upload report
        if: ${{ !cancelled() && hashFiles('coverage/index.html') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage
          retention-days: 7

  build:
    name: 🛠️ Build | Production bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Git | Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🟢 Node | Set up environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 📦 NPM | Install dependencies
        run: npm ci

      - name: 🗃️ Next.js | Cache the Turbopack build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache/turbopack
          key: turbopack-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'public/**', 'next.config.ts') }}
          restore-keys: turbopack-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: 🛠️ Next.js | Build without settings or a database
        run: npm run build

      - name: 📏 Build | Verify output and report bundle size
        run: node scripts/build-report.mjs >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: 🎭 E2E | ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Chromium with Lighthouse and WebKit run side by side
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Chromium, accessibility and Lighthouse
            browser: chromium
            project: lighthouse
          - name: WebKit
            browser: webkit
            project: webkit
    steps:
      - name: 📥 Git | Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🟢 Node | Set up environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 📦 NPM | Install dependencies
        run: npm ci

      - name: 🗃️ Next.js | Cache the Turbopack build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache/turbopack
          key: turbopack-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'public/**', 'next.config.ts') }}
          restore-keys: turbopack-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      # A browser fits one Ubuntu, so its cache key names the runner image
      - name: 🎭 Playwright | Read the version and the runner image
        id: playwright
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"

      - name: 🗃️ Playwright | Cache the browser
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}

      - name: 🎭 Playwright | Install the browser
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps "$BROWSER"
        env:
          BROWSER: ${{ matrix.browser }}

      - name: 🧩 Playwright | Install system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps "$BROWSER"
        env:
          BROWSER: ${{ matrix.browser }}

      - name: 🧪 Playwright | Run against a throwaway database
        run: npm run test:e2e -- --project="$PROJECT"
        env:
          PROJECT: ${{ matrix.project }}

      - name: 📤 Playwright | Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report
          retention-days: 7

  docker:
    name: 🐳 Docker | Build and start the runtime image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 📥 Git | Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🧱 Docker | Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: 🐳 Docker | Build the staging image without secrets
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          build-args: APP_ENV=staging
          tags: app:ci
          load: true
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,scope=runtime,mode=max

      - name: 🧾 Compose | Check every environment
        run: |
          for env in staging production; do cp .env.example ".env.$env"; done
          for env in development staging production; do
            docker compose --env-file .env.example -f compose.yaml -f "docker/$env.yaml" config --quiet
          done

      - name: 🩺 Docker | Check that the container answers
        run: |
          docker run --detach --name app --env APP_ENV=staging --publish 8080:3000 app:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://localhost:8080/healthz; then exit 0; fi
            sleep 1
          done
          docker logs app
          exit 1

  # Pull requests only: new dependencies with known advisories fail
  dependency-review:
    name: 🛡️ Security | Review dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Git | Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🛡️ GitHub | Review dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
