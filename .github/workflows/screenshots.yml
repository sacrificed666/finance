name: 📸 Finance | Screenshots

# Takes the screenshots of the visual tests on Linux, by hand after a design change
on:
  workflow_dispatch:

# A read-only token
permissions:
  contents: read

jobs:
  screenshots:
    name: 📸 Playwright | Take the screenshots of the visual tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 📥 Git | Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🟢 Node | Set up environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 📦 NPM | Install dependencies
        run: npm ci

      - name: 🎭 Playwright | Read version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: 🗃️ Playwright | Cache the browser
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: 🎭 Playwright | Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: 🧩 Playwright | Install system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: 📸 Playwright | Take every screenshot again
        run: |
          mkdir -p e2e/__screenshots__
          npx playwright test --project=visual --update-snapshots=all

      - name: 📤 Playwright | Upload the screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: e2e/__screenshots__
          retention-days: 7
