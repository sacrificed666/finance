name: 📡 Finance | Monitor

# The live site hourly and Lighthouse weekly, once MONITOR_URL is set
on:
  schedule:
    - cron: "23 * * * *"
    - cron: "41 5 * * 1"
  workflow_dispatch:

# A read-only token
permissions:
  contents: read

# One check at a time
concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  uptime:
    name: 📡 Uptime | Pages, health checks and security.txt
    if: vars.MONITOR_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📥 Git | Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🟢 Node | Set up environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: 📡 Site | Check the pages listed under monitor in package.json
        run: node scripts/check-live.mjs >> "$GITHUB_STEP_SUMMARY"
        env:
          MONITOR_URL: ${{ vars.MONITOR_URL }}

  lighthouse:
    name: 🚦 Lighthouse | Scores of the live site
    if: vars.MONITOR_URL != '' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '41 5 * * 1')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 📥 Git | Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🟢 Node | Set up environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 📦 NPM | Install dependencies
        run: npm ci

      # A browser fits one Ubuntu, so its cache key names the runner image
      - name: 🎭 Playwright | Read the version and the runner image
        id: playwright
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"

      - name: 🗃️ Playwright | Cache the browser
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}-chromium

      - name: 🎭 Playwright | Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: 🧩 Playwright | Install system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: 🚦 Lighthouse | Audit the monitor pages of package.json
        run: node scripts/lighthouse-live.mjs >> "$GITHUB_STEP_SUMMARY"
        env:
          MONITOR_URL: ${{ vars.MONITOR_URL }}

      - name: 📤 Lighthouse | Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-live
          path: lighthouse-live
          retention-days: 30
