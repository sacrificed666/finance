name: 🔗 Finance | Shared files

# Weekly and by hand: the files the four apps share must stay identical
on:
  schedule:
    - cron: "59 6 * * 1"
  workflow_dispatch:

# A read-only token
permissions:
  contents: read

jobs:
  shared:
    name: 🔗 Shared | Compare with tasks, weather and faceit-stats
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 📥 Git | Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 📥 Git | Checkout tasks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sacrificed666/tasks
          path: siblings/tasks
          persist-credentials: false

      - name: 📥 Git | Checkout weather
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sacrificed666/weather
          path: siblings/weather
          persist-credentials: false

      - name: 📥 Git | Checkout faceit-stats
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sacrificed666/faceit-stats
          path: siblings/faceit-stats
          persist-credentials: false

      - name: 🟢 Node | Set up environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: 🔗 Shared | Compare the shared files
        run: node scripts/check-shared.mjs siblings
